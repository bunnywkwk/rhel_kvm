---
# RHEL 10 - Modular Libvirt Daemon model

# RHEL 10 packages are also signed with a post-quantum key that an older 10.1
# image doesn't have: redhat-release is updated before packages are installed
# (see tasks/packages.yml).
rhel_kvm_update_redhat_release: true

# Bare qemu:///system already resolves to the modular sockets here (libvirtd
# doesn't exist on RHEL 10), so no explicit socket path is needed like on
# RHEL 9's rhel_kvm_libvirt_uri.
rhel_kvm_libvirt_uri: "qemu:///system"

# Modular driver systemd sockets to enabled and start
rhel_kvm_sockets:
  - virtqemud.socket
  - virtqemud-ro.socket
  - virtqemud-admin.socket
  - virtnetworkd.socket
  - virtnetworkd-ro.socket
  - virtnetworkd-admin.socket
  - virtstoraged.socket
  - virtstoraged-ro.socket
  - virtstoraged-admin.socket
  - virtnodedevd.socket
  - virtnodedevd-ro.socket
  - virtnodedevd-admin.socket
  - virtsecretd.socket
  - virtsecretd-ro.socket
  - virtsecretd-admin.socket
  - virtnwfilterd.socket
  - virtnwfilterd-ro.socket
  - virtnwfilterd-admin.socket

# Modular services MUST be enabled for autostart features (VMs, Networks, Pools) to work on boot
rhel_kvm_services:
  - virtqemud.service
  - virtnetworkd.service
  - virtstoraged.service

# Ensure legacy monolithic service does not conflict
rhel_kvm_disabled_services:
  - libvirtd.service
  - libvirtd.socket
  - libvirtd-ro.socket
  - libvirtd-admin.socket
