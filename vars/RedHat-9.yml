---
# RHEL 9 - Monolithic libvirt model: libvirtd is the daemon that is enabled and started.

# RHEL 9 validates only the classic RSA signature; no redhat-release update
# needed (see tasks/packages.yml for the RHEL 10 post-quantum key).
rhel_kvm_update_redhat_release: false

# libvirtd.service brings its own sockets: enabling it also enables libvirtd.socket, -ro and
# -admin (Also= in the unit file), and starting it starts them (Wants=). No socket is listed.
rhel_kvm_sockets: []

# Monolithic service
rhel_kvm_services:
  - libvirtd.service

# Nothing is disabled or masked on RHEL 9: the other libvirt daemons stay as the OS ships them.
rhel_kvm_disabled_services: []
