---

# Rhel 9 - Monolithic Libvirt Daemon model

# kvm daemon set for rhel 9 (monolithic)
rhel_kvm_daemon_model: monolithic


# Monolithic systemd sockets to enabled and start
rhel_kvm_sockets:
  - libvirtd.socket
  - libvirtd-ro.socket
  - libvirtd-admin.socket

# Monolithic service
rhel_kvm_services:
  - libvirtd.service

# Modular sockets to disable/mask (not used on RHEL 9 monolithic)
rhel_kvm_disabled_sockets: []
