---
# ==============================================================================
# Dedicated Hypervisor Bridge Network Configuration
# ==============================================================================

# Defines, starts, and enables autostart for the dedicated bridge network using native libvirt module
- name: Define and activate dedicated bridge network
  community.libvirt.virt_net:
    name: "{{ kvm_bridge_network_name }}"
    state: active
    autostart: "{{ kvm_bridge_autostart | default(true) }}"
    xml: "{{ lookup('ansible.builtin.template', 'bridge_network.xml.j2') }}"
    uri: "qemu:///system"
  when: kvm_manage_bridge_network | bool
