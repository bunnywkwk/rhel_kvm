---
# Dedicated Hypervisor Bridge Network Configuration

# Defines the dedicated bridge network (must be defined before it can be activated)
- name: Ensure dedicated bridge network is defined
  community.libvirt.virt_net:
    name: "{{ rhel_kvm_bridge_network_name }}"
    state: present
    xml: "{{ lookup('ansible.builtin.template', 'bridge_network.xml.j2') }}"
  when: rhel_kvm_manage_bridge_network | bool

# Activates the dedicated bridge network
- name: Activate dedicated bridge network
  community.libvirt.virt_net:
    name: "{{ rhel_kvm_bridge_network_name }}"
    state: active
  when: rhel_kvm_manage_bridge_network | bool

# Sets autostart for the dedicated bridge network.
# Split from the task above: community.libvirt.virt_net returns as soon as it
# handles `state`, so passing `autostart` in the same task is silently ignored
# and the network does not come back up on reboot. See:
# https://github.com/ansible-collections/community.libvirt/blob/main/plugins/modules/virt_net.py
- name: Autostart dedicated bridge network
  community.libvirt.virt_net:
    name: "{{ rhel_kvm_bridge_network_name }}"
    autostart: "{{ rhel_kvm_bridge_autostart | default(true) }}"
  when: rhel_kvm_manage_bridge_network | bool
