---
# Dedicated Hypervisor Bridge Network Configuration

# Defines the dedicated bridge network (must be defined before it can be activated)
- name: Ensure dedicated bridge network is defined
  community.libvirt.virt_net:
    name: "{{ rhel_kvm_bridge_network_name }}"
    state: present
    xml: "{{ lookup('ansible.builtin.template', 'bridge_network.xml.j2') }}"
    uri: "{{ rhel_kvm_libvirt_uri }}"
  when: rhel_kvm_manage_bridge_network | bool

# Activates and sets autostart for the dedicated bridge network
- name: Activate and autostart dedicated bridge network
  community.libvirt.virt_net:
    name: "{{ rhel_kvm_bridge_network_name }}"
    state: active
    autostart: "{{ rhel_kvm_bridge_autostart | default(true) }}"
    uri: "{{ rhel_kvm_libvirt_uri }}"
  when: rhel_kvm_manage_bridge_network | bool
