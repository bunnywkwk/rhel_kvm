---
# ==============================================================================
# Storage Pool Provisioning & SELinux Configuration
# ==============================================================================

# Creates directory paths (like /var/lib/libvirt/images) with restrictive 0711 permissions
- name: Ensure storage pool directories exist with correct permissions
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "0711"
  loop: "{{ kvm_storage_pools }}"
  when: item.type == 'dir'

# Registers virt_image_t SELinux label in the system database for persistence across filesystem relabels
- name: Set persistent SELinux context on storage directories
  community.general.sefcontext:
    target: "{{ item.path }}(/.*)?"
    setype: virt_image_t
    state: present
  loop: "{{ kvm_storage_pools }}"
  when:
    - ansible_facts['selinux'] is defined
    - ansible_facts['selinux']['status'] == 'enabled'
    - item.type == 'dir'

# Immediately applies virt_image_t SELinux label to directory so KVM can write VM disk images
- name: Apply SELinux context to storage pool directory contents
  ansible.builtin.file:
    path: "{{ item.path }}"
    setype: virt_image_t
    recurse: false
    state: directory
  loop: "{{ kvm_storage_pools }}"
  when:
    - ansible_facts['selinux'] is defined
    - ansible_facts['selinux']['status'] == 'enabled'
    - item.type == 'dir'

# Queries virsh to discover which storage pools are already defined on the hypervisor
- name: Check existing libvirt storage pools
  ansible.builtin.command:
    cmd: virsh pool-list --all --name
  register: kvm_existing_pools
  changed_when: false

# Queries current pool information (active state and autostart state)
- name: Query existing storage pool info
  ansible.builtin.command:
    cmd: "virsh pool-info {{ item.name }}"
  loop: "{{ kvm_storage_pools }}"
  when: item.name in kvm_existing_pools.stdout_lines
  register: kvm_pool_info_results
  changed_when: false

# Initializes and builds the storage pool backing structure if required by libvirt
- name: Build storage pool if not already active
  ansible.builtin.command:
    cmd: "virsh pool-build {{ item.name }}"
  loop: "{{ kvm_storage_pools }}"
  when: item.name in kvm_existing_pools.stdout_lines
  register: kvm_pool_build_result
  changed_when: kvm_pool_build_result.rc == 0
  failed_when: false

# Activates the storage pool only if it is not currently active
- name: Start libvirt storage pools
  ansible.builtin.command:
    cmd: "virsh pool-start {{ item.item.name }}"
  loop: "{{ kvm_pool_info_results.results }}"
  when:
    - item.skipped is not defined or not item.skipped
    - "'Active:          no' in item.stdout or 'Active: no' in item.stdout"
  register: kvm_pool_start_result
  changed_when: kvm_pool_start_result.rc == 0
  failed_when: false

# Sets the storage pool autostart only if it is currently 'no'
- name: Enable autostart on libvirt storage pools
  ansible.builtin.command:
    cmd: "virsh pool-autostart {{ item.item.name }}"
  loop: "{{ kvm_pool_info_results.results }}"
  when:
    - item.skipped is not defined or not item.skipped
    - item.item.autostart | default(true) | bool
    - "'Autostart:       no' in item.stdout or 'Autostart: no' in item.stdout"
  register: kvm_pool_autostart_result
  changed_when: kvm_pool_autostart_result.rc == 0
  failed_when: false
