---
# Storage pools: each pool is a directory where libvirt stores VM disks.
# Every task loops over rhel_kvm_storage_pools.

# Creates the directory (root only, mode 0711) with the label QEMU needs to write VM disks.
# The label is ignored when SELinux is disabled.
- name: Ensure storage pool directories exist with the VM image label
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "0711"
    setype: virt_image_t
  loop: "{{ rhel_kvm_storage_pools }}"

# Records the label in the SELinux policy so it survives a filesystem relabel
- name: Set persistent SELinux context on storage directories
  community.general.sefcontext:
    target: "{{ item.path }}(/.*)?"
    setype: virt_image_t
    state: present
  loop: "{{ rhel_kvm_storage_pools }}"
  when:
    - ansible_facts['selinux'] is defined
    - ansible_facts['selinux']['status'] == 'enabled'

# Defines the pools in libvirt (a pool must be defined before it can be started)
- name: Ensure libvirt storage pools are defined
  community.libvirt.virt_pool:
    name: "{{ item.name }}"
    state: present
    xml: "<pool type='dir'><name>{{ item.name }}</name><target><path>{{ item.path }}</path></target></pool>"
  loop: "{{ rhel_kvm_storage_pools }}"

# Starts the pools
- name: Activate libvirt storage pools
  community.libvirt.virt_pool:
    name: "{{ item.name }}"
    state: active
  loop: "{{ rhel_kvm_storage_pools }}"

# Sets autostart. A separate task: community.libvirt.virt_pool returns as soon as it
# handles `state`, so `autostart` in the same task is silently ignored and the pool
# does not come back after a reboot.
- name: Autostart libvirt storage pools
  community.libvirt.virt_pool:
    name: "{{ item.name }}"
    autostart: true
  loop: "{{ rhel_kvm_storage_pools }}"
