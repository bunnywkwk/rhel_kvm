---
# RHEL KVM DEFAULT VARIABLES

# Manage kernel sysctl parameters (net.ipv4.ip_forward)
rhel_kvm_manage_sysctl: true

# users to add to the libvirt group for non-root management
rhel_kvm_admin_users: []

# Users can add custom tools here (e.g. guestfs-tools) without replacing core binaries
rhel_kvm_extra_packages: []

# storage pools to provision
rhel_kvm_storage_pools:
  - name: default
    path: /var/lib/libvirt/images
    type: dir
    autostart: true

# Provisions a dedicated virtual switch for inter-VM and VM-to-host communication
rhel_kvm_manage_bridge_network: true
rhel_kvm_bridge_network_name: "kvm_br0"
rhel_kvm_bridge_device: "virbr1"
rhel_kvm_bridge_ip: "192.168.100.1"
rhel_kvm_bridge_netmask: "255.255.255.0"
rhel_kvm_bridge_dhcp_start: "192.168.100.10"
rhel_kvm_bridge_dhcp_end: "192.168.100.254"
rhel_kvm_bridge_autostart: true
