---
# RHEL KVM DEFAULT VARIABLES

# Manage kernel sysctl parameters (net.ipv4.ip_forward)
kvm_manage_sysctl: true

# users to add to the libvirt group for non-root management
kvm_admin_users: []

# Users can add custom tools here (e.g. guestfs-tools) without replacing core binaries
kvm_extra_packages: []

# storage pools to provision
kvm_storage_pools:
  - name: default
    path: /var/lib/libvirt/images
    type: dir
    autostart: true
    state: active

# Provisions a dedicated virtual switch for inter-VM and VM-to-host communication
kvm_manage_bridge_network: true
kvm_bridge_network_name: "kvm_br0"
kvm_bridge_device: "virbr1"
kvm_bridge_ip: "192.168.100.1"
kvm_bridge_netmask: "255.255.255.0"
kvm_bridge_dhcp_start: "192.168.100.10"
kvm_bridge_dhcp_end: "192.168.100.254"
kvm_bridge_autostart: true

# Deploy automated verification script to /usr/local/bin
kvm_deploy_verification_tools: true
