# rhel_kvm - Ansible Galaxy Role Metadata

galaxy_info:
  author: "Aeron"
  description: "Enterprise KVM Hypervisor provisioning role supporting Monolithic (EL9) and Modular (EL10) Libvirt"
  company: "Aeron - Trainee at AIRNAV"
  license: MIT
  role_name: rhel_kvm
  namespace: ansible-lockdown
  min_ansible_version: "2.16.1"
  platforms:
