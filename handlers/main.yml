---
# rhel_kvm Handlers

# Reloads systemd manager configuration when unit files or sockets are modified
- name: Reload systemd daemon
  ansible.builtin.systemd_service:
    daemon_reload: true

#  Restarts monolithic libvirtd service on RHEL 9
- name: Restart libvirtd
  ansible.builtin.systemd_service:
    name: libvirtd.service
    state: restarted
  when: kvm_daemon_model == 'monolithic'

# Restart modular QEMU driver service on RHEL 10
- name: Restart virtqemud
  ansible.builtin.systemd_service:
    name: virtqemud.service
    state: restarted
  when: kvm_daemon_model == 'modular'

# Reload all kernet sysctl setting from /etc/sysctl.d/
- name: Reload sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: false
